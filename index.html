<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threadoku Solver</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-color: #42686df4;
        }
        h1 {
            color: #000000;
            margin-bottom: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .board-container {
            margin-top: 20px;
        }
        .sudoku-board {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            gap: 1px;
            border: 2px solid #333;
            background-color: #333;
            width: 450px;
            height: 450px;
        }
        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            font-size: 24px;
            font-weight: bold;
            cursor: default;
            user-select: none;
        }
        .cell.initial {
            color: #333;
        }
        .cell.solved {
            color: #0066cc;
        }
        .cell:nth-child(3n) {
            border-right: 2px solid #333;
        }
        .cell:nth-child(9n) {
            border-right: none;
        }
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }
        .buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #generate-btn {
            background-color: #934b48;
            color: white;
        }
        #generate-btn:hover {
            background-color: #45a049;
        }
        #solve-btn {
            background-color: #2196F3;
            color: white;
            opacity: 0.5;
            cursor: not-allowed;
        }
        #solve-btn.active {
            opacity: 1;
            cursor: pointer;
        }
        #solve-btn.active:hover {
            background-color: #45a049;
        }
        .status {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            height: 24px;
        }
    </style>
    <!-- Classic script on purpose: it needs document.currentScript -->
    <script src="coi-serviceworker.js"></script>
</head>
<body>
    <h1>Threadoku Solver</h1>
    <div class="container">
        <div class="board-container">
            <div class="sudoku-board" id="sudoku-board"></div>
        </div>
        <div class="buttons">
            <button id="generate-btn">Generate Board</button>
            <button id="solve-btn">Solve Board</button>
        </div>
        <div class="status" id="status"></div>
    </div>

    <script type="module">
        const N = 9;
        let board = Array(9).fill().map(() => Array(9).fill(0));
        let originalBoard = Array(9).fill().map(() => Array(9).fill(0));
        const solveBtn = document.getElementById('solve-btn');
        const generateBtn = document.getElementById('generate-btn');
        const statusDisplay = document.getElementById('status');

        // ---- WASM solver ----
        // No JS fallback on purpose: if WASM fails, say so instead of hiding it

        let engineReady = false;
        let boardReady = false;
        let nextRequestId = 0;
        const pending = new Map();

        const solverWorker = new Worker('./solver-worker.js', { type: 'module' });

        solverWorker.onmessage = (event) => {
            const { type, id } = event.data;

            if (type === 'ready') {
                engineReady = true;
                refreshSolveButton();
                return;
            }

            if (type === 'solved') {
                const resolve = pending.get(id);
                pending.delete(id);
                if (resolve) resolve(event.data);
                return;
            }

            if (type === 'error') {
                if (id !== undefined && pending.has(id)) {
                    const resolve = pending.get(id);
                    pending.delete(id);
                    resolve({ error: event.data.error });
                } else {
                    engineReady = false;
                    statusDisplay.textContent = 'WASM solver unavailable: ' + event.data.error;
                    refreshSolveButton();
                }
            }
        };

        solverWorker.onerror = (err) => {
            engineReady = false;
            statusDisplay.textContent =
                'Worker error: ' + (err.message || 'failed to load solver-worker.js');
            refreshSolveButton();
        };

        function solveInWasm(puzzle) {
            const id = nextRequestId++;
            return new Promise((resolve) => {
                pending.set(id, resolve);
                solverWorker.postMessage({ id, board: puzzle });
            });
        }

        // ---- board rendering ----

        function createBoard() {
            const boardElement = document.getElementById('sudoku-board');
            boardElement.innerHTML = '';

            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${i}-${j}`;
                    boardElement.appendChild(cell);
                }
            }
        }

        function updateBoard() {
            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    const cell = document.getElementById(`cell-${i}-${j}`);
                    if (board[i][j] === 0) {
                        cell.textContent = '';
                        cell.className = 'cell';
                    } else if (originalBoard[i][j] !== 0) {
                        cell.textContent = board[i][j];
                        cell.className = 'cell initial';
                    } else {
                        cell.textContent = board[i][j];
                        cell.className = 'cell solved';
                    }
                }
            }
        }

        function refreshSolveButton() {
            solveBtn.classList.toggle('active', engineReady && boardReady);
        }

        // ---- puzzle source ----

        // Fallback so the demo still works if the API is down
        const FALLBACK_PUZZLE = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9],
        ];

        async function fetchRandomSudoku() {
            statusDisplay.textContent = 'Fetching a random board...';
            let grid = null;

            try {
                const response = await fetch('https://sudoku-api.vercel.app/api/dosuku');
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                grid = data.newboard.grids[0].value;
            } catch (error) {
                console.error('Error fetching sudoku:', error);
                grid = FALLBACK_PUZZLE;
            }

            for (let i = 0; i < N; i++) {
                for (let j = 0; j < N; j++) {
                    board[i][j] = grid[i][j];
                    originalBoard[i][j] = grid[i][j];
                }
            }

            updateBoard();
            boardReady = true;
            refreshSolveButton();
            statusDisplay.textContent = grid === FALLBACK_PUZZLE
                ? 'Puzzle API unreachable - loaded a built-in board.'
                : 'Board generated! Click Solve to solve.';
        }

        // ---- solving ----

        async function solveBoard() {
            // Always solve from the givens, not a previous solution
            const puzzle = originalBoard.map((row) => row.slice());

            // Don't await requestAnimationFrame here - it never fires in a hidden tab
            statusDisplay.textContent = 'Solving in WebAssembly...';

            const result = await solveInWasm(puzzle);

            if (result.error) {
                statusDisplay.textContent = 'Solver error: ' + result.error;
                return;
            }

            // Unsolvable puzzles come back with empty cells still in them
            const solved = result.solution.every((row) => row.every((v) => v !== 0));

            if (!solved) {
                statusDisplay.textContent = 'No solution exists for this board.';
                return;
            }

            board = result.solution;
            updateBoard();
            statusDisplay.textContent = `Solved in ${result.elapsedMs.toFixed(2)} ms`;
        }

        // ---- wiring ----

        generateBtn.addEventListener('click', fetchRandomSudoku);

        solveBtn.addEventListener('click', function () {
            if (this.classList.contains('active')) solveBoard();
        });

        createBoard();
        updateBoard();
    </script>
</body>
</html>
